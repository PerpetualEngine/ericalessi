<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Type audition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&family=Source+Sans+3:wght@300;400;500&family=Work+Sans:wght@300;400;500&family=DM+Sans:wght@300;400;500&family=Manrope:wght@300;400;500&family=Jost:wght@300;400;500&family=Space+Grotesk:wght@300;400;500&family=Instrument+Sans:wght@400;500&family=Figtree:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#202020;--muted:#6f6f6c;--hair:#E6E6E3;--lime:#C9F57E;--bg-sec:#F4F4F2;
--sans:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:2rem 6vw 5rem}
.intro{color:var(--muted);margin-bottom:2.5rem}
.card{border-top:1px solid var(--hair);padding:2.2rem 0 2.6rem}
.tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem}
.tag b{color:var(--ink);font-size:13px;letter-spacing:.06em;text-transform:none;margin-right:.6rem}
.hero{font-size:2.4rem;line-height:1.1;margin:0 0 .4rem}
.h2{font-size:1.35rem;line-height:1.3;margin:1.1rem 0 .3rem}
.eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin:1.2rem 0 .3rem}
.body{color:var(--muted);max-width:60ch;margin:.4rem 0 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
.pair>div{background:var(--bg-sec);padding:1.2rem 1.4rem}
.w{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.6rem}
@media (max-width:640px){.pair{grid-template-columns:1fr}.hero{font-size:2rem}}
</style>
</head>
<body>
<div class="wrap">
<p class="intro">Nine faces for the headings. Body text stays the system font in every card, so you are only judging the titles. Left column is Regular (400), right is Medium (500). Reply with a number and a weight.</p>

<script>
const fonts=[
 ["0","System sans (current face, lighter weights)","-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif"],
 ["1","IBM Plex Sans","'IBM Plex Sans',sans-serif"],
 ["2","Source Sans 3","'Source Sans 3',sans-serif"],
 ["3","Work Sans","'Work Sans',sans-serif"],
 ["4","DM Sans","'DM Sans',sans-serif"],
 ["5","Manrope","'Manrope',sans-serif"],
 ["6","Jost","'Jost',sans-serif"],
 ["7","Space Grotesk","'Space Grotesk',sans-serif"],
 ["8","Instrument Sans","'Instrument Sans',sans-serif"],
 ["9","Figtree","'Figtree',sans-serif"],
];
for(const [n,name,stack] of fonts){
  const block=(w)=>`<div><div class="w">${w==400?'Regular 400':'Medium 500'}</div>
   <h1 class="hero" style="font-family:${stack};font-weight:${w}">Eric Alessi</h1>
   <div class="eyebrow">An honest newsletter</div>
   <h2 class="h2" style="font-family:${stack};font-weight:${w}">Fuel for the curious dancer</h2>
   <h2 class="h2" style="font-family:${stack};font-weight:${w};font-size:1.15rem">Cage's idea, someone else's classroom</h2>
   <p class="body">One short email a week. One minute to read and be inspired. A statement I can't stop returning to: equilibrium is where the dance ends, and your partner's real job is to help you lose your vertical.</p></div>`;
  document.write(`<section class="card"><div class="tag"><b>${n}</b>${name}</div><div class="pair">${block(400)}${block(500)}</div></section>`);
}
</script>
</div>
</body>
</html>
